<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Local, not @import — render-time network is banned, and a webfont that
         fails silently falls back and ships the sting in the wrong typeface. */
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url("fonts/schibsted-grotesk.woff2") format("woff2");
        font-weight: 100 900; font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 100 900; font-display: block;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0e13; }
      body { font-family: "Schibsted Grotesk", sans-serif; }

      /* The app's own tokens (design-tokens.json) — no colour exists here that
         the product does not already own. */
      :root {
        --base: #0b0e13; --surface: #11151c; --edge: #1c222c; --edge-strong: #262d38;
        --ink: #e6e8eb; --muted: #9aa3ae; --faint: #5b6470;
        --accent: #46a758; --accent-soft: #4cc38a; --down: #dd6a6e;
      }
      .mono { font-family: "JetBrains Mono", monospace; }

      /* ---- hero frame, static ----
         Every group below sits at its FINAL resting place; the timeline is the
         journey each one takes to get here. */
      #stagecenter {
        position: absolute; inset: 0;
        display: block;
      }

      /* The tape. Final rest: dim furniture near the top of the lockup. During
         the opening it rides y:+230 (frame centre) and slides in from x:+1400. */
      /* Centering lives in GSAP (xPercent: -50), not CSS transform — GSAP
         owns the full transform state of anything it tweens. */
      #tape {
        position: absolute; left: 50%; top: 310px;
        white-space: nowrap;
        font-family: "JetBrains Mono", monospace;
        font-size: 34px; letter-spacing: 0.04em;
        color: var(--faint);
      }
      #tape .print { margin: 0 34px; }
      #tape .sym { color: var(--muted); font-weight: 700; }
      #tape .up { color: var(--accent-soft); }
      #tape .dn { color: var(--down); }
      /* The landing print — the one that stops the tape. */
      #tape .hero .sym { color: var(--ink); }

      /* The lamp. Ignites just above the landing print, then rides the nudge
         to its place at the top of the lockup. */
      #lamp {
        position: absolute; left: 50%; top: 385px;
        visibility: hidden;
      }
      #pill {
        position: relative; z-index: 2;
        display: inline-flex; align-items: center; gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 26px; font-weight: 700; letter-spacing: 0.22em;
        color: var(--accent-soft);
        background: rgba(70, 167, 88, 0.10);
        border: 1.5px solid rgba(70, 167, 88, 0.45);
        border-radius: 999px; padding: 14px 34px 14px 28px;
      }
      #pill .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--accent-soft); }
      .ping {
        position: absolute; left: 50%; top: 50%;
        width: 220px; height: 220px; margin: -110px 0 0 -110px;
        border: 2px solid var(--accent-soft); border-radius: 50%;
        visibility: hidden; pointer-events: none;
      }

      /* The bloom behind the whole lockup — the studio light coming up. */
      #glow {
        position: absolute; left: 50%; top: 46%;
        width: 1500px; height: 1000px; margin: -500px 0 0 -750px;
        background: radial-gradient(closest-side, rgba(76, 195, 138, 0.13), rgba(76, 195, 138, 0.04) 55%, transparent 75%);
        visibility: hidden;
      }

      /* The identity: the V mark drawing on beside the wordmark. */
      #identity {
        position: absolute; left: 50%; top: 470px;
        transform: translateX(-50%);
        display: flex; align-items: center; gap: 38px;
      }
      #vmark { display: block; }
      #vmark .draw { fill: none; stroke: var(--accent-soft); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      #wordmark {
        overflow: hidden;
        font-size: 128px; font-weight: 700; letter-spacing: -0.015em;
        color: var(--ink); line-height: 1.08;
      }
      #wordmark span { display: inline-block; visibility: hidden; }

      #tagline {
        position: absolute; left: 50%; top: 660px;
        transform: translateX(-50%);
        font-size: 40px; font-weight: 500; letter-spacing: -0.01em;
        color: var(--muted); white-space: nowrap;
        visibility: hidden;
      }
      #sweep {
        position: absolute; left: 50%; top: 736px;
        width: 340px; height: 3px; margin-left: -170px;
        background: var(--accent);
        transform-origin: left center;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-4nyc" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div data-hf-id="hf-zw8q" id="stagecenter">
        <div data-hf-id="hf-27c6" id="glow"></div>

        <!-- The tape: market data streaming through a dark studio. The last
             print is the one that stops — its stop is the cause of everything
             after it. Shapes, not data: same rule as the product's own demos. -->
        <div data-hf-id="hf-iwn6" id="tape" aria-hidden="true">
          <span data-hf-id="hf-133a" class="print"><span data-hf-id="hf-3jn0" class="sym">AAPL</span> 227.98 <span data-hf-id="hf-2u5n" class="dn">-1.14%</span></span>
          <span data-hf-id="hf-5r1c" class="print"><span data-hf-id="hf-xbkg" class="sym">MSFT</span> 454.12 <span data-hf-id="hf-7gef" class="dn">-0.48%</span></span>
          <span data-hf-id="hf-zpwt" class="print"><span data-hf-id="hf-haol" class="sym">NVDA</span> 124.60 <span data-hf-id="hf-6f7i" class="dn">-3.79%</span></span>
          <span data-hf-id="hf-nqzf" class="print"><span data-hf-id="hf-sseu" class="sym">GOOGL</span> 182.26 <span data-hf-id="hf-w6gu" class="up">+0.60%</span></span>
          <span data-hf-id="hf-shv7" class="print hero"><span data-hf-id="hf-ets8" class="sym">AMD</span> 158.90 <span data-hf-id="hf-81p1" class="up">+1.24%</span></span>
        </div>

        <!-- The lamp: pill + two pings. Ignites the frame the tape stops. -->
        <div data-hf-id="hf-1yjb" id="lamp">
          <div data-hf-id="hf-4ag3" class="ping" id="ping1"></div>
          <div data-hf-id="hf-teyg" class="ping" id="ping2"></div>
          <span data-hf-id="hf-fnsa" id="pill"><span data-hf-id="hf-9gry" class="dot"></span>ON AIR</span>
        </div>

        <!-- The identity. The V mark draws on; the wordmark waterfalls in. -->
        <div data-hf-id="hf-ez43" id="identity">
          <svg data-hf-id="hf-rbu4" id="vmark" width="118" height="118" viewBox="0 0 118 118" aria-hidden="true">
            <!-- rounded-square badge, then the V — the app's own mark, drawn -->
            <rect data-hf-id="hf-1xpf" class="draw" id="badge" x="8" y="8" width="102" height="102" rx="26" />
            <path data-hf-id="hf-6da5" class="draw" id="vee" d="M 38 38 L 59 82 L 80 38" />
          </svg>
          <div data-hf-id="hf-z1h5" id="wordmark" aria-label="VANTAGE">
            <span data-hf-id="hf-dn4l">V</span><span data-hf-id="hf-ms68">A</span><span data-hf-id="hf-gtkt">N</span><span data-hf-id="hf-efqn">T</span><span data-hf-id="hf-r7dk">A</span><span data-hf-id="hf-kec2">G</span><span data-hf-id="hf-l6y4">E</span>
          </div>
        </div>

        <div data-hf-id="hf-p6dl" id="tagline">The market, on air.</div>
        <div data-hf-id="hf-1yur" id="sweep"></div>
      </div>
    </div>

    <script>
      // ONE paused timeline; the host owns playback. Deterministic throughout —
      // no clocks, no randomness, every value written here.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // Stroke draw-on: dasharray safely longer than either path, so offset L
      // hides the stroke and offset 0 shows all of it, with nothing measured.
      const L = 460;
      gsap.set("#badge, #vee", { strokeDasharray: L, strokeDashoffset: L });

      // ---- 0.0s → the tape streams in (the current: LEFT) ------------------
      // One decelerating slide: the tape arrives at speed and comes to rest
      // with the hero print centred. The deceleration IS the stop — and the
      // stop is the cause of the ignition. The whole opening rides y:+230
      // (frame centre); the resting CSS position is the lockup's top.
      // xPercent -100 parks the row's RIGHT edge at frame centre; the +215
      // shifts it so the HERO print — the last one, the one that stops —
      // rests centred under the lamp. The row is measured by construction,
      // not by getBoundingClientRect: fonts race measurements.
      tl.fromTo("#tape",
        { xPercent: -100, x: 1650, y: 230, autoAlpha: 1 },
        { xPercent: -100, x: 215, duration: 1.2, ease: "power3.out" }, 0);

      // ---- 1.2s → IGNITION (same frame as the landing) ---------------------
      // A broadcast flicker: two hard steps, not a fade. Lamps strike; they
      // do not ease.
      tl.set("#lamp", { xPercent: -50, y: 230, autoAlpha: 1 }, 1.2);
      tl.fromTo("#pill", { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.2);
      tl.set("#pill", { opacity: 0.35 }, 1.26);
      tl.set("#pill", { opacity: 1 }, 1.32);
      // The ring leaves the lamp on the ignition frame.
      tl.fromTo("#ping1",
        { autoAlpha: 0.9, scale: 0.55 },
        { autoAlpha: 0, scale: 2.1, duration: 1.4, ease: "power2.out" }, 1.2);
      // The house lights come up because the lamp is on.
      tl.fromTo("#glow", { autoAlpha: 0, scale: 0.9 },
        { autoAlpha: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 1.2);
      // The rest of the tape dims — the studio's attention narrows to the lamp.
      tl.to("#tape", { color: "#3a424d", duration: 0.8, ease: "power2.out" }, 1.32);

      // 1.6 → 2.4: the dramatic comma. The ping is still travelling out and
      // the glow still blooming, but nothing NEW happens — action, then beat,
      // then result.

      // ---- 2.4s → the identity arrives --------------------------------------
      // The lamp summoned it, so the lamp makes room. The tape's whole job was
      // to cause the ignition; done, it rises out with the same nudge and
      // leaves the lockup clean — dim residue behind a wordmark is clutter,
      // and sub-contrast text is a lie about being readable.
      tl.to("#tape", { y: 0, autoAlpha: 0, duration: 0.7, ease: "power3.inOut" }, 2.4);
      tl.to("#lamp", { y: 0, duration: 0.7, ease: "power3.inOut" }, 2.44);
      // The V mark draws on — badge first, the V close behind it.
      tl.to("#badge", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 2.55);
      tl.to("#vee", { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 2.85);
      // The wordmark waterfalls in: seven letters, 55ms apart (385ms total),
      // each rising through the wordmark's own clip edge.
      tl.fromTo("#wordmark span",
        { y: "1.05em", autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.55, stagger: 0.055, ease: "back.out(1.4)" }, 2.7);

      // ---- 3.9s → the claim -------------------------------------------------
      tl.fromTo("#tagline", { y: 16, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, ease: E }, 3.9);
      tl.fromTo("#sweep", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 4.15);

      // ---- 4.7s → one echo of the ring, then a composed, still hold ---------
      // A scheduled beat, not an idle loop: the lamp answers the finished
      // lockup once, and then the frame holds.
      tl.fromTo("#ping2",
        { autoAlpha: 0.55, scale: 0.55 },
        { autoAlpha: 0, scale: 1.9, duration: 1.1, ease: "power2.out" }, 4.7);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
